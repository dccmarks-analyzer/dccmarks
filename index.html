<div class="card" id="regTeacherFormCard">
    <h3 class="section-title">නව ගුරු තොරතුරු ඇතුළත් කරන්න</h3>
    <form id="teacherRegForm">
        <!-- මූලික තොරතුරු -->
        <div class="flex-row" style="margin-bottom: 10px;">
            <input type="text" id="treg_id" placeholder="ගුරු හැඳුනුම් අංකය (Teacher ID)" required>
            <input type="text" id="treg_name" placeholder="නම (Name)" required style="text-align: left; padding-left: 15px;">
        </div>
        <input type="tel" id="treg_phone" placeholder="දුරකථන අංකය (Phone Number)" required style="margin-bottom: 15px;">

        <!-- 1. පන්තිභාර ගුරු තොරතුරු -->
        <div style="background: #f1f8e9; padding: 15px; border-radius: 8px; border: 1px solid #c5e1a5; margin-bottom: 15px; text-align: left;">
            <label style="font-weight: bold; display: flex; align-items: center; gap: 10px; color: #2e7d32; cursor: pointer;">
                <input type="checkbox" id="treg_isClassTeacher" style="width: 20px; height: 20px; cursor: pointer;">
                පන්තිභාර ගුරුවරයෙක් ද? (Class Teacher)
            </label>
            <div id="treg_class_selects" style="display: none; margin-top: 10px;">
                <div class="flex-row">
                    <select id="treg_classGrade" style="border: 1px solid #a5d6a7;">
                        <option value="" disabled selected>ශ්‍රේණිය</option>
                        <option value="6">6</option><option value="7">7</option><option value="8">8</option>
                        <option value="9">9</option><option value="10">10</option><option value="11">11</option>
                        <option value="12">12</option><option value="13">13</option>
                    </select>
                    <select id="treg_classLetter" style="border: 1px solid #a5d6a7;">
                        <option value="" disabled selected>පන්තිය</option>
                        <option value="A1">A1</option><option value="A2">A2</option><option value="C1">C1</option><option value="C2">C2</option>
                        <option value="T1">T1</option><option value="T2">T2</option><option value="M1">M1</option><option value="M2">M2</option>
                        <option value="S1">S1</option><option value="S2">S2</option>
                        <option value="A">A</option><option value="B">B</option><option value="C">C</option>
                        <option value="D">D</option><option value="E">E</option><option value="F">F</option><option value="G">G</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 2. විෂයභාර ගුරු තොරතුරු (වෙනමම ලැයිස්තුවක් ලෙස) -->
        <div style="background: #e3f2fd; padding: 15px; border-radius: 8px; border: 1px solid #90caf9; margin-bottom: 15px; text-align: left;">
            <h4 style="margin: 0 0 10px 0; color: #1565c0; font-size: 15px;">📚 උගන්වන විෂය / විෂයයන් තෝරන්න (Subject Teacher)</h4>
            
            <div id="treg_subject_list" style="max-height: 250px; overflow-y: auto; background: #fff; border: 1px solid #bbdefb; border-radius: 6px; margin-bottom: 10px;">
                <!-- JS මගින් විෂයයන් වගුවක් ලෙස මෙතැනට එකතු වේ -->
            </div>
            
            <input type="text" id="treg_teachingClasses" placeholder="මෙම විෂයයන් උගන්වන පන්ති (උදා: 6-A, 10-B, 11-A)" style="text-align: left; padding-left: 10px; border: 1px solid #90caf9;">
        </div>

        <div style="display: flex; gap: 10px; margin-top: 5px;">
            <button type="submit" class="btn-submit" style="flex: 2; margin-top: 0; background: linear-gradient(to right, #9c27b0, #7b1fa2);">ගුරුවරයා ලියාපදිංචි කරන්න</button>
            <button type="button" onclick="clearTeacherForm()" class="btn-clear" style="flex: 1; margin-top: 0; padding: 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">Clear</button>
        </div>
    </form>
</div>
